name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.303

      - name: Validate tag and source version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          [xml]$props = Get-Content .\Directory.Build.props -Raw
          $sourceVersion = [string]($props.Project.PropertyGroup | Select-Object -First 1).Version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $version -ne $sourceVersion) {
            throw "Tag version '$version' does not match source version '$sourceVersion'."
          }
          "FLARE_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore .\FlareQuotes.sln --locked-mode -p:ContinuousIntegrationBuild=true

      - name: Restore pinned release tools
        shell: pwsh
        run: dotnet tool restore

      - name: Audit direct and transitive NuGet dependencies
        shell: pwsh
        run: |
          $report = dotnet list .\FlareQuotes.sln package --vulnerable --include-transitive --format json --no-restore
          if ($LASTEXITCODE -ne 0) { throw "NuGet vulnerability audit failed." }
          if (($report -join "`n") -match '"advisoryUrl"\s*:') {
            $report | Write-Host
            throw "A vulnerable NuGet package was detected."
          }

      - name: Verify repository source formatting
        shell: pwsh
        run: dotnet format .\FlareQuotes.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Validate UI contract
        shell: pwsh
        run: dotnet test .\FlareQuotes.Tests\FlareQuotes.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~MainViewModelUiRefreshTests"

      - name: Build application with warnings as errors
        shell: pwsh
        run: dotnet build .\FlareQuotes.App\FlareQuotes.App.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true

      - name: Build tests with warnings as errors
        shell: pwsh
        run: dotnet build .\FlareQuotes.Tests\FlareQuotes.Tests.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true

      - name: Run automated tests
        shell: pwsh
        run: dotnet test .\FlareQuotes.Tests\FlareQuotes.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName!~GmailEveryModelIntegrationTests"

      - name: Enforce production line coverage floor
        shell: pwsh
        run: .\scripts\Test-Coverage.ps1 -Threshold 45

      - name: Render and validate Windows UI snapshots
        shell: pwsh
        timeout-minutes: 3
        run: .\scripts\Invoke-UiSnapshotGate.ps1 -OutputPath artifacts/ui-snapshots -TimeoutSeconds 120

      - name: Upload rendered UI review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-ui-${{ github.run_id }}
          path: artifacts/ui-snapshots
          if-no-files-found: warn
          retention-days: 30

      - name: Install pinned Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build unsigned release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:FLARE_RELEASE_VERSION
          $tag = "v$version"
          $repo = "kbAppDev/flare-fireplace-quotes-updates"
          $releaseDir = Join-Path $PWD "artifacts\release"
          $publishDir = Join-Path $PWD "artifacts\publish"
          New-Item -ItemType Directory -Path $releaseDir, $publishDir -Force | Out-Null

          dotnet publish .\FlareQuotes.App\FlareQuotes.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=true `
            -p:ContinuousIntegrationBuild=true `
            -p:Version=$version `
            -p:AssemblyVersion="$version.0" `
            -p:FileVersion="$version.0" `
            -p:InformationalVersion=$version `
            -p:ProductVersion=$version `
            -o $publishDir
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }

          $publishedExe = Join-Path $publishDir "Flare Fireplace Quotes.exe"
          if (-not (Test-Path -LiteralPath $publishedExe -PathType Leaf)) {
            throw "Published application executable is missing."
          }

          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found." }

          & $iscc `
            "/DMyAppVersion=$version" `
            "/DSourceDir=$publishDir" `
            "/O$releaseDir" `
            "/FFlare.Fireplace.Quotes" `
            .\FlareQuotes.App\Installer\FlareFireplacesQuotesInstaller.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

          $installer = Join-Path $releaseDir "Flare.Fireplace.Quotes.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer asset was not created."
          }

          $portable = Join-Path $releaseDir "Flare.Fireplace.Quotes-portable.zip"
          Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath $portable -CompressionLevel Optimal -Force

          $sbomWorkDir = Join-Path $env:RUNNER_TEMP "flare-quotes-sbom-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $sbomWorkDir -Force | Out-Null
          dotnet tool run sbom-tool generate `
            -b $publishDir `
            -bc $PWD `
            -m $sbomWorkDir `
            -pn "Flare Fireplace Quotes" `
            -pv $version `
            -ps "Flare Fireplaces" `
            -nsb "https://github.com/kbAppDev/flare-fireplace-quotes-updates" `
            -D true `
            -V Warning
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed." }
          $generatedSbom = Join-Path $sbomWorkDir "_manifest\spdx_2.2\manifest.spdx.json"
          $releaseSbom = Join-Path $releaseDir "Flare.Fireplace.Quotes.spdx.json"
          if (-not (Test-Path -LiteralPath $generatedSbom -PathType Leaf)) {
            throw "The release SBOM was not generated."
          }
          Copy-Item -LiteralPath $generatedSbom -Destination $releaseSbom
          Copy-Item -LiteralPath (Join-Path $PWD "THIRD-PARTY-NOTICES.md") `
            -Destination (Join-Path $releaseDir "THIRD-PARTY-NOTICES.md")

          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $installer).Length
          $installerUrl = "https://github.com/$repo/releases/download/$tag/Flare.Fireplace.Quotes.exe"
          $metadata = [ordered]@{
            version = $version
            installer = $installerUrl
            url = $installerUrl
            sha256 = $hash
            sizeBytes = $size
            notes = "Flare Fireplace Quotes v$version includes correctness, security, and reliability improvements."
          }
          $metadataPath = Join-Path $releaseDir "release-metadata.json"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($metadataPath, ($metadata | ConvertTo-Json -Depth 10), $utf8NoBom)

      - name: Upload verified build for isolated publishing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ github.run_id }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 7

  sign-verify-and-publish:
    needs: build-and-test
    runs-on: windows-2022
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out release tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit on protected main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch protected main." }
          $tagCommit = (git rev-parse "$env:GITHUB_SHA^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the release tag commit." }
          $mainCommit = (git rev-parse refs/remotes/origin/main).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $mainCommit) {
            throw "Release tag must point to the current protected-main commit."
          }

      - name: Download verified release build
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: unsigned-release-${{ github.run_id }}
          path: artifacts/release

      - name: Sign update manifest with release-environment key
        shell: pwsh
        env:
          UPDATE_MANIFEST_SIGNING_KEY_PEM: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY_PEM }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedKeyFingerprint = "098c6b505a5cecbe6c060c80633f4283cc12597291113eb266ef3293bfff2066"
          $releaseDir = Join-Path $PWD "artifacts\release"
          $metadataPath = Join-Path $releaseDir "release-metadata.json"
          $installer = Join-Path $releaseDir "Flare.Fireplace.Quotes.exe"
          $portable = Join-Path $releaseDir "Flare.Fireplace.Quotes-portable.zip"

          if ([string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_SIGNING_KEY_PEM)) {
            throw "Release-environment secret UPDATE_MANIFEST_SIGNING_KEY_PEM is not configured."
          }
          $sbom = Join-Path $releaseDir "Flare.Fireplace.Quotes.spdx.json"
          $notices = Join-Path $releaseDir "THIRD-PARTY-NOTICES.md"
          foreach ($path in @($metadataPath, $installer, $portable, $sbom, $notices)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required release input is missing: $path" }
          }

          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $expectedUrl = "https://github.com/kbAppDev/flare-fireplace-quotes-updates/releases/download/$tag/Flare.Fireplace.Quotes.exe"
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualSize = (Get-Item -LiteralPath $installer).Length

          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $metadata.version -ne $version) {
            throw "Release metadata version does not match the tag."
          }
          if ($metadata.url -ne $expectedUrl -or $metadata.installer -ne $expectedUrl) {
            throw "Release metadata contains an unexpected installer URL."
          }
          if ($metadata.sha256 -ne $actualHash -or [long]$metadata.sizeBytes -ne $actualSize) {
            throw "Release metadata does not match the installer bytes."
          }
          if ([string]::IsNullOrWhiteSpace($metadata.notes) -or $metadata.notes.Length -gt 12000) {
            throw "Release metadata notes are invalid."
          }

          $rsa = [System.Security.Cryptography.RSA]::Create()
          try {
            $rsa.ImportFromPem($env:UPDATE_MANIFEST_SIGNING_KEY_PEM)
            $publicKeyBytes = $rsa.ExportSubjectPublicKeyInfo()
            $fingerprint = [Convert]::ToHexString(
              [System.Security.Cryptography.SHA256]::HashData($publicKeyBytes)).ToLowerInvariant()
            if ($fingerprint -ne $expectedKeyFingerprint) {
              throw "The configured signing key does not match the public key embedded in the app."
            }

            $payload = [string]::Join("`n", @(
              $metadata.version.Trim(),
              $metadata.url.Trim(),
              $metadata.sha256.Trim().ToLowerInvariant(),
              ([long]$metadata.sizeBytes).ToString([System.Globalization.CultureInfo]::InvariantCulture),
              $metadata.notes.Trim()
            ))
            $signatureBytes = $rsa.SignData(
              [System.Text.Encoding]::UTF8.GetBytes($payload),
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
            $signature = [Convert]::ToBase64String($signatureBytes)

            if (-not $rsa.VerifyData(
              [System.Text.Encoding]::UTF8.GetBytes($payload),
              $signatureBytes,
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)) {
              throw "The generated manifest signature did not verify."
            }

            $publicKeyPem = $rsa.ExportSubjectPublicKeyInfoPem()
            [System.IO.File]::WriteAllText(
              (Join-Path $releaseDir "manifest-public-key.pem"),
              $publicKeyPem,
              [System.Text.UTF8Encoding]::new($false))
          }
          finally {
            $rsa.Dispose()
          }

          $manifest = [ordered]@{
            version = $metadata.version
            installer = $metadata.installer
            url = $metadata.url
            sha256 = $metadata.sha256
            sizeBytes = [long]$metadata.sizeBytes
            notes = $metadata.notes
            signatureAlgorithm = "RS256"
            signature = $signature
          }
          $manifestPath = Join-Path $releaseDir "flare-quotes-v2-latest.json"
          [System.IO.File]::WriteAllText(
            $manifestPath,
            ($manifest | ConvertTo-Json -Depth 10),
            [System.Text.UTF8Encoding]::new($false))

          # v1.6.8 and earlier only understand the legacy unsigned v1 feed. The v1.6.9 app
          # never reads this file; it is pinned to the signed v2 feed above.
          $legacyManifest = [ordered]@{
            version = $metadata.version
            installer = $metadata.installer
            url = $metadata.url
            sha256 = $metadata.sha256
            sizeBytes = [long]$metadata.sizeBytes
            notes = $metadata.notes
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $releaseDir "flare-quotes-v1-latest.json"),
            ($legacyManifest | ConvertTo-Json -Depth 10),
            [System.Text.UTF8Encoding]::new($false))

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $repo = "kbAppDev/flare-fireplace-quotes-updates"
          $releaseDir = Join-Path $PWD "artifacts\release"
          $installer = Join-Path $releaseDir "Flare.Fireplace.Quotes.exe"
          $portable = Join-Path $releaseDir "Flare.Fireplace.Quotes-portable.zip"
          $manifest = Join-Path $releaseDir "flare-quotes-v2-latest.json"
          $legacyManifest = Join-Path $releaseDir "flare-quotes-v1-latest.json"
          $sbom = Join-Path $releaseDir "Flare.Fireplace.Quotes.spdx.json"
          $notices = Join-Path $releaseDir "THIRD-PARTY-NOTICES.md"
          $notes = Join-Path $releaseDir "release-notes.txt"
          [System.IO.File]::WriteAllText(
            $notes,
            "Flare Fireplace Quotes v$version`n`n- Correctness, update-security, resilience, and quality improvements.`n- Update manifests are now cryptographically verified before installers can run.",
            [System.Text.UTF8Encoding]::new($false))

          $existingReleaseJson = gh release view $tag --repo $repo --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existingRelease = $existingReleaseJson | ConvertFrom-Json
            if (-not $existingRelease.isDraft) {
              throw "A published release already exists for $tag; refusing to replace it."
            }

            gh release delete $tag --repo $repo --yes
            if ($LASTEXITCODE -ne 0) { throw "Existing draft release cleanup failed." }
          }

          gh release create $tag $installer $manifest $legacyManifest $portable $sbom $notices `
            --repo $repo `
            --verify-tag `
            --draft `
            --title "Flare Fireplace Quotes v$version" `
            --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw "Draft GitHub release creation failed." }

      - name: Re-download and verify draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $repo = "kbAppDev/flare-fireplace-quotes-updates"
          $sourceDir = Join-Path $PWD "artifacts\release"
          $verifyDir = Join-Path $PWD "artifacts\verify"
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null

          foreach ($assetName in @("Flare.Fireplace.Quotes.exe", "flare-quotes-v2-latest.json", "flare-quotes-v1-latest.json", "Flare.Fireplace.Quotes-portable.zip", "Flare.Fireplace.Quotes.spdx.json", "THIRD-PARTY-NOTICES.md")) {
            gh release download $tag --repo $repo --pattern $assetName --dir $verifyDir
            if ($LASTEXITCODE -ne 0) { throw "Could not re-download draft asset: $assetName" }
            $source = Join-Path $sourceDir $assetName
            $downloaded = Join-Path $verifyDir $assetName
            if ((Get-Item -LiteralPath $source).Length -ne (Get-Item -LiteralPath $downloaded).Length -or
                (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash) {
              throw "Published draft asset does not match the verified build: $assetName"
            }
          }

          $manifest = Get-Content -LiteralPath (Join-Path $verifyDir "flare-quotes-v2-latest.json") -Raw | ConvertFrom-Json
          $payload = [string]::Join("`n", @(
            $manifest.version.Trim(),
            $manifest.url.Trim(),
            $manifest.sha256.Trim().ToLowerInvariant(),
            ([long]$manifest.sizeBytes).ToString([System.Globalization.CultureInfo]::InvariantCulture),
            $manifest.notes.Trim()
          ))
          $rsa = [System.Security.Cryptography.RSA]::Create()
          try {
            $rsa.ImportFromPem((Get-Content -LiteralPath (Join-Path $sourceDir "manifest-public-key.pem") -Raw))
            $valid = $rsa.VerifyData(
              [System.Text.Encoding]::UTF8.GetBytes($payload),
              [Convert]::FromBase64String($manifest.signature),
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
            if (-not $valid -or $manifest.signatureAlgorithm -ne "RS256") {
              throw "The downloaded update manifest signature is invalid."
            }
          }
          finally {
            $rsa.Dispose()
          }

          $release = gh release view $tag --repo $repo --json isDraft | ConvertFrom-Json
          if (-not $release.isDraft) { throw "Release must remain a draft until verification completes." }

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit $env:GITHUB_REF_NAME `
            --repo kbAppDev/flare-fireplace-quotes-updates `
            --draft=false `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "Verified release could not be published." }

      - name: Upload signed release record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-${{ github.run_id }}
          path: |
            artifacts/release/Flare.Fireplace.Quotes.exe
            artifacts/release/Flare.Fireplace.Quotes-portable.zip
            artifacts/release/flare-quotes-v2-latest.json
            artifacts/release/flare-quotes-v1-latest.json
            artifacts/release/release-metadata.json
            artifacts/release/Flare.Fireplace.Quotes.spdx.json
            artifacts/release/THIRD-PARTY-NOTICES.md
          if-no-files-found: warn
          retention-days: 30

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  security-events: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate tag and source version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          [xml]$props = Get-Content .\Directory.Build.props -Raw
          $sourceVersion = [string]($props.Project.PropertyGroup | Select-Object -First 1).Version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $version -ne $sourceVersion) {
            throw "Tag version '$version' does not match source version '$sourceVersion'."
          }
          "FLARE_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: csharp
          queries: security-extended,security-and-quality

      - name: Restore
        shell: pwsh
        run: dotnet restore .\FlareQuotes.sln

      - name: Audit direct and transitive NuGet dependencies
        shell: pwsh
        run: |
          $report = dotnet list .\FlareQuotes.sln package --vulnerable --include-transitive --format json --no-restore
          if ($LASTEXITCODE -ne 0) { throw "NuGet vulnerability audit failed." }
          if (($report -join "`n") -match '"advisoryUrl"\s*:') {
            $report | Write-Host
            throw "A vulnerable NuGet package was detected."
          }

      - name: Verify repository source formatting
        shell: pwsh
        run: dotnet format .\FlareQuotes.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Validate UI contract
        shell: pwsh
        run: dotnet test .\FlareQuotes.Tests\FlareQuotes.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~MainViewModelUiRefreshTests"

      - name: Build with warnings as errors
        shell: pwsh
        run: dotnet build .\FlareQuotes.App\FlareQuotes.App.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Run automated tests
        shell: pwsh
        run: dotnet test .\FlareQuotes.Tests\FlareQuotes.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName!~GmailEveryModelIntegrationTests"

      - name: Render and validate Windows UI snapshots
        shell: pwsh
        run: |
          $outputPath = Join-Path $PWD "artifacts\ui-snapshots"
          if (Test-Path -LiteralPath $outputPath) { throw "UI snapshot output already exists." }
          New-Item -ItemType Directory -Path $outputPath | Out-Null
          $env:FLARE_UI_SNAPSHOT_MODE = "1"
          $env:FLARE_UI_SNAPSHOT_DIR = $outputPath
          dotnet run --project .\FlareQuotes.App\FlareQuotes.App.csproj -c Release --no-restore -p:DefineConstants=FLARE_UI_SNAPSHOTS -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw "UI snapshot process failed." }
          foreach ($fileName in @("main-window-dark.png", "main-window-minimum.png", "settings-window-dark.png", "settings-window-minimum.png", "layout-metrics.json")) {
            $path = Join-Path $outputPath $fileName
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -lt 2) {
              throw "Required UI snapshot artifact is missing or empty: $fileName"
            }
          }
          if (Test-Path -LiteralPath (Join-Path $outputPath "snapshot-error.txt")) {
            throw (Get-Content -LiteralPath (Join-Path $outputPath "snapshot-error.txt") -Raw)
          }

      - name: Upload rendered UI review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-ui-${{ github.run_id }}
          path: artifacts/ui-snapshots
          if-no-files-found: warn
          retention-days: 30

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and publish updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:FLARE_RELEASE_VERSION
          $tag = "v$version"
          $repo = "kbAppDev/flare-fireplace-quotes-updates"
          $artifactDir = Join-Path $PWD "artifacts\release"
          $publishDir = Join-Path $PWD "artifacts\publish"
          $installerDir = Join-Path $PWD "installer"
          New-Item -ItemType Directory -Path $artifactDir, $publishDir, $installerDir -Force | Out-Null

          dotnet publish .\FlareQuotes.App\FlareQuotes.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -p:Version=$version `
            -p:AssemblyVersion="$version.0" `
            -p:FileVersion="$version.0" `
            -p:InformationalVersion=$version `
            -p:ProductVersion=$version `
            -o $publishDir
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }

          $publishedExe = Join-Path $publishDir "Flare Fireplace Quotes.exe"
          if (-not (Test-Path -LiteralPath $publishedExe -PathType Leaf)) {
            throw "Published application executable is missing."
          }

          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found." }

          & $iscc `
            "/DMyAppVersion=$version" `
            "/DSourceDir=$publishDir" `
            "/FFlare.Fireplace.Quotes" `
            .\FlareQuotes.App\Installer\FlareFireplacesQuotesInstaller.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

          $installer = Join-Path $installerDir "Flare.Fireplace.Quotes.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer asset was not created."
          }

          $portable = Join-Path $artifactDir "Flare.Fireplace.Quotes-portable.zip"
          Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath $portable -CompressionLevel Optimal -Force

          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $installer).Length
          $installerUrl = "https://github.com/$repo/releases/download/$tag/Flare.Fireplace.Quotes.exe"
          $manifest = [ordered]@{
            version = $version
            installer = $installerUrl
            url = $installerUrl
            sha256 = $hash
            sizeBytes = $size
            notes = "Flare Fireplace Quotes v$version adds clear location names throughout multi-fireplace quotes."
          }
          $manifestPath = Join-Path $artifactDir "flare-quotes-v1-latest.json"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 10), $utf8NoBom)

          $releaseNotes = @"
          Flare Fireplace Quotes v$version

          - Names each fireplace by location throughout multi-fireplace quote cards, PDFs, specification links, email headings, and URL review.
          - Keeps duplicate fireplace models clearly separated by room or project location.
          - Includes the v1.6.6 pricing, media, parser, and estimated-total corrections.
          - Removes obsolete packaged builds and legacy release helpers from the current source.
          "@

          gh release create $tag `
            $installer `
            $manifestPath `
            $portable `
            --repo $repo `
            --title "Flare Fireplace Quotes v$version" `
            --notes $releaseNotes
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed." }

          $verifyDir = Join-Path $PWD "artifacts\verify"
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null
          gh release download $tag --repo $repo --pattern "Flare.Fireplace.Quotes.exe" --dir $verifyDir
          if ($LASTEXITCODE -ne 0) { throw "Published installer verification download failed." }
          $downloaded = Join-Path $verifyDir "Flare.Fireplace.Quotes.exe"
          if ((Get-Item -LiteralPath $downloaded).Length -ne $size -or
              (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
            throw "Published installer does not match the verified release asset."
          }

      - name: Upload release build record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.run_id }}
          path: artifacts/release
          if-no-files-found: warn
          retention-days: 30
